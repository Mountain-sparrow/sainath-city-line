<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platform Bookstall</title>
<meta name="description" content="What Sainath Reddy is reading: book cards, short summaries and the code snippets they inspired.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Noto+Sans+Telugu:wght@600;800&display=swap">
<style>
/* Layout: a station bookstall. Shelf of cover cards, then one book open as a ticket-style detail view (routed by #book-id). */
:root{
  --night:#0b1030;
  --night-2:#141a44;
  --paper:#eef0fb;
  --muted:#a7acd3;
  --signal:#f5c518;
  --rail:#c8342b;
  --neon:#7ef0ff;
  --card:#fbf8f1;
  --card-ink:#1b1208;
  --f-disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-te:"Noto Sans Telugu","Nirmala UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;background:linear-gradient(180deg,var(--night-2),var(--night) 60%);color:var(--paper);font:15px/1.55 var(--f-body);min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:32px}
a{color:var(--neon)}
a:focus-visible,button:focus-visible{outline:2px solid var(--signal);outline-offset:3px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.back{font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--paper);text-decoration:none;border:1.5px solid rgba(255,255,255,.4);padding:7px 12px;border-radius:999px}
.back:hover{border-color:var(--signal);color:var(--signal)}

.awning{height:18px;background:repeating-linear-gradient(90deg,var(--rail) 0 30px,#f1e3b8 30px 60px);border-radius:4px 4px 0 0}
.sign{background:var(--signal);color:#111;border:3px solid #141414;border-radius:4px;padding:16px 20px;display:grid;gap:4px}
.sign small{font:500 10.5px var(--f-mono);letter-spacing:.18em;text-transform:uppercase}
.sign h1{margin:0;font:900 clamp(40px,8vw,84px)/.88 var(--f-disp);text-transform:uppercase;text-wrap:balance}
.sign p{margin:6px 0 0;max-width:60ch}

.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font:600 13px var(--f-body);color:var(--paper);background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--paper);color:var(--night)}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px;padding-bottom:18px;border-bottom:10px solid #5a3e2a;box-shadow:0 12px 0 -4px #3d2a1c}
.book{all:unset;cursor:pointer;display:grid;grid-template-rows:auto auto;gap:10px;min-width:0}
.cover{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:3px 8px 8px 3px;padding:42px 16px 16px 22px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:inset 8px 0 0 rgba(0,0,0,.22),0 10px 24px rgba(0,0,0,.4);transition:transform .25s,box-shadow .25s;overflow:hidden}
.cover::after{content:"";position:absolute;inset:auto -30% -30% auto;width:80%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.08)}
.book:hover .cover,.book:focus-visible .cover{transform:translateY(-6px) rotate(-1deg);box-shadow:inset 8px 0 0 rgba(0,0,0,.22),0 18px 30px rgba(0,0,0,.5)}
.book:focus-visible .cover{outline:3px solid var(--signal);outline-offset:3px}
.cover .ct{overflow-wrap:anywhere;font:900 26px/.95 var(--f-disp);text-transform:uppercase;text-wrap:balance;position:relative;z-index:1}
.cover .te{display:block;font:800 30px/1.25 var(--f-te);text-transform:none;margin-bottom:8px}
.cover .te-a{font:600 12px var(--f-te);text-transform:none;letter-spacing:0}
.cover .fav{position:absolute;top:12px;left:22px;z-index:2;font:500 9.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;background:var(--signal);color:#111;padding:3px 7px;border-radius:3px}
.cover .ca{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.9;position:relative;z-index:1}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meta b{font-weight:600;font-size:14px;line-height:1.25;min-width:0}
.pill{flex:none;font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid currentColor}
.s-reading{color:var(--signal)}
.s-finished{color:#9be59b}
.s-next{color:var(--muted)}
.ticket .native{font:800 22px/1.3 var(--f-te);color:#7a5a3c}

.empty{padding:28px;border:1px dashed rgba(255,255,255,.3);border-radius:8px;color:var(--muted)}

/* detail */
.detail{display:grid;grid-template-columns:240px 1fr;gap:32px;align-items:start}
.detail>*{min-width:0}
.detail .cover{width:240px}
.ticket{background:var(--card);color:var(--card-ink);border-radius:6px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.ticket .tk{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--rail);color:#fff;padding:10px 18px;font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase}
.ticket .bd{padding:20px 22px 24px;border-top:2px dashed #e0d6c4;display:grid;gap:14px}
.ticket h2{margin:0;font:900 clamp(30px,5vw,46px)/.92 var(--f-disp);text-transform:uppercase;text-wrap:balance}
.ticket .by{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#7a5a3c}
.ticket h3{margin:6px 0 0;font:500 10.5px var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:#c8342b}
.ticket p{margin:0;max-width:65ch}
.ticket ul{margin:0;padding-left:20px;display:grid;gap:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font:500 11px var(--f-mono);padding:3px 9px;border-radius:999px;background:#efe7d8}
.snip{border-radius:6px;overflow:hidden;border:1px solid #2a2f5c}
.snip .sh{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#141a44;color:#cfd6ff;padding:8px 12px;font:500 11px var(--f-mono)}
.snip .sh button{font:600 11px var(--f-body);background:var(--signal);color:#111;border:0;border-radius:4px;padding:4px 10px;cursor:pointer}
.snip pre{margin:0;padding:14px;background:#0b1030;color:#e6e9ff;font:500 12.5px/1.6 var(--f-mono);overflow-x:auto}
.soon{padding:14px;border:1.5px dashed #c9b99c;border-radius:6px;color:#7a5a3c}

@media (max-width:720px){
  .detail{grid-template-columns:1fr}
  .detail .cover{width:160px}
  .shelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .cover .ct{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="./">Back to the city line</a>
    <span class="back" style="border:0;opacity:.7" id="count"></span>
  </div>

  <main id="view"></main>
</div>

<script>
/*
  HOW TO UPDATE THE BOOKSTALL
  Add, edit or reorder books in this list. Fields:
    id        short name used in the link, letters/numbers/hyphens only
    title     book title
    author    author name
    status    'reading' | 'finished' | 'next'
    fav       true to show under Favourites
    lang      'en' or 'te' (Telugu books get their own filter)
    native    optional title in Telugu script, nativeAuthor for the author
    color     cover colour (any CSS colour)
    tags      a few short labels
    summary   one or two short paragraphs, in your own words
    ideas     a few key ideas, as short bullet points
    snippets  code snippets: { title, lang, code }  (leave [] for "coming soon")
*/
const BOOKS = [
  {
    id: 'kafka-on-the-shore', title: 'Kafka on the Shore', author: 'Haruki Murakami',
    status: 'reading', fav: false, lang: 'en', color: '#1f5c63',
    tags: ['Novel', 'Magical realism'],
    summary: [
      'Two stories run side by side. Kafka Tamura, fifteen, runs away from home in Tokyo and ends up living in a quiet private library. Nakata, an old man who lost the ability to read after a strange childhood incident, can talk to cats and sets off on a journey of his own.',
      'The two paths slowly bend toward each other through dreams, memory and fate, in the way only Murakami can pull off.'
    ],
    ideas: ['Some questions are better lived with than answered.', 'Memory can be a place you visit, not just something you have.'],
    snippets: []
  },
  {
    id: 'the-silent-patient', title: 'The Silent Patient', author: 'Alex Michaelides',
    status: 'finished', fav: false, lang: 'en', color: '#3a3a46',
    tags: ['Novel', 'Psychological thriller'],
    summary: [
      'Alicia Berenson, a successful painter, shoots her husband and then never says another word. Years later, psychotherapist Theo Faber takes a job at the clinic where she is held, convinced he can get her to talk.',
      'No spoilers here. It is a short, fast read built around one big question: why did she go silent?'
    ],
    ideas: ['Silence can say more than a confession.', 'Every narrator has a reason for the story they choose to tell.'],
    snippets: []
  },
  {
    id: 'almanack-of-naval-ravikant', title: 'The Almanack of Naval Ravikant', author: 'Eric Jorgenson',
    status: 'finished', fav: true, lang: 'en', color: '#2b5aa6',
    tags: ['Wealth', 'Happiness', 'Philosophy'],
    summary: [
      'A collection of Naval Ravikant\'s ideas, pulled together from his tweets, podcasts and interviews. Half of it is about building wealth, half about being happy, and both halves are short enough to reread.',
      'The core of the wealth half: build specific knowledge, take accountability, use leverage like code and media, and play long-term games with long-term people.'
    ],
    ideas: ['Seek wealth, not money or status.', 'Code and media are leverage that needs nobody\'s permission.', 'Happiness is a skill you can practise.'],
    snippets: [
      {
        title: 'Why long games win: daily compounding', lang: 'python',
        code: `def compound(start=1.0, daily_gain=0.01, days=365):
    """Small daily gains, compounded over a year."""
    return start * (1 + daily_gain) ** days

print(round(compound(), 1))                  # 37.8x after a year of 1% better days
print(round(compound(daily_gain=-0.01), 2))  # 0.03x if you slip 1% a day`
      }
    ]
  },
  {
    id: 'the-art-of-spending-money', title: 'The Art of Spending Money', author: 'Morgan Housel',
    status: 'finished', fav: true, lang: 'en', color: '#2f6b3a',
    tags: ['Money', 'Behaviour'],
    summary: [
      'From the author of The Psychology of Money. Where that book was about earning and saving, this one asks the harder question: how do you spend money in a way that actually makes your life better?',
      'Housel looks at why spending to impress rarely satisfies, how independence is one of the best things money can buy, and why knowing what is enough matters more than having more.'
    ],
    ideas: ['Money is most useful as freedom over your time.', 'Spending to be admired usually costs more than it returns.', 'Enough is a number worth knowing.'],
    snippets: []
  },
  {
    id: 'sapiens', title: 'Sapiens', author: 'Yuval Noah Harari',
    status: 'finished', fav: false, lang: 'en', color: '#8a6a2e',
    tags: ['History', 'Big ideas'],
    summary: [
      'A brief history of humankind told through three big shifts: the cognitive revolution, the agricultural revolution and the scientific revolution.',
      'The big idea: humans rule the planet because we can cooperate in huge numbers around shared stories, like money, nations, companies and religions, that exist only because we all believe in them.'
    ],
    ideas: ['Money is the most successful shared story ever told.', 'Progress for the species is not always progress for the individual.'],
    snippets: []
  },
  {
    id: 'the-wealth-money-cant-buy', title: "The Wealth Money Can't Buy", author: 'Robin Sharma',
    status: 'finished', fav: false, lang: 'en', color: '#2e5d73',
    tags: ['Life', 'Self-growth'],
    summary: [
      'Robin Sharma argues that money is only one of eight forms of wealth. The others are growth, wellness, family, craft, community, adventure and service.',
      'The book is a practical nudge to check how rich your life is on all eight, not just the one that shows up in a bank statement.'
    ],
    ideas: ['Being rich in one form of wealth and broke in the rest is still being broke.', 'Small daily rituals build the forms of wealth that matter most.'],
    snippets: []
  },
  {
    id: 'the-mountain-is-you', title: 'The Mountain Is You', author: 'Brianna Wiest',
    status: 'finished', fav: false, lang: 'en', color: '#4a5a6e',
    tags: ['Psychology', 'Self-growth'],
    summary: [
      'A book about self-sabotage. Wiest argues that the biggest obstacle in most lives is not out there, it is the habits and fears we keep repeating to stay comfortable.',
      'It walks through how to spot those patterns, understand what they are protecting you from, and build the emotional resilience to climb past them.'
    ],
    ideas: ['Self-sabotage is usually an unmet need, not a lack of willpower.', 'The goal is not to conquer the mountain but to master yourself.'],
    snippets: []
  },
  {
    id: 'the-joys-of-compounding', title: 'The Joys of Compounding', author: 'Gautam Baid',
    status: 'finished', fav: false, lang: 'en', color: '#3b6b4f',
    tags: ['Investing', 'Value investing', 'Life'],
    summary: [
      'Gautam Baid mixes value investing with life lessons, leaning heavily on Buffett, Munger and a lot of good reading.',
      'The thread through it all: compounding works on money, knowledge and character in the same way. Be patient, keep learning, and let time do the heavy lifting.'
    ],
    ideas: ['Compounding knowledge is as powerful as compounding capital.', 'Patience is an edge most people refuse to use.'],
    snippets: []
  },
  {
    id: 'maidanam', title: 'Maidanam', native: 'మైదానం', author: 'Chalam', nativeAuthor: 'చలం',
    status: 'finished', fav: true, lang: 'te', color: '#8a3b2a',
    tags: ['Telugu', 'Novel', 'Classic'],
    summary: [
      'Rajeswari, a married woman, walks out of her home and her marriage to live with the man she loves, out in an open field. She tells the story herself, without apology.',
      'Chalam wrote it in the 1920s and it shook Telugu society. It is still one of the boldest books in the language about a woman\'s freedom and desire.'
    ],
    ideas: ['Respectability can be its own kind of cage.', 'A story told without apology can still unsettle readers a century later.'],
    snippets: []
  },
  {
    id: 'brahmaneekam', title: 'Brahmaneekam', native: 'బ్రాహ్మణీకం', author: 'Chalam', nativeAuthor: 'చలం',
    status: 'finished', fav: true, lang: 'te', color: '#6b4a32',
    tags: ['Telugu', 'Novel', 'Social critique'],
    summary: [
      'Chalam turns on the orthodoxy he was born into. The novel shows how rigid caste custom and the idea of being proper end up crushing the lives of the people, especially the women, living inside it.',
      'Sharp, angry and very Chalam.'
    ],
    ideas: ['Tradition deserves questions, not just obedience.'],
    snippets: []
  },
  {
    id: 'mahaprasthanam', title: 'Mahaprasthanam', native: 'మహాప్రస్థానం', author: 'Sri Sri', nativeAuthor: 'శ్రీశ్రీ',
    status: 'finished', fav: true, lang: 'te', color: '#a8342b',
    tags: ['Telugu', 'Poetry', 'Classic'],
    summary: [
      'Sri Sri\'s landmark 1950 collection, the book that changed modern Telugu poetry. The poems speak for workers, the poor and the forgotten, and they broke away from the old classical forms to do it.',
      'Loud, rhythmic and impossible to read quietly.'
    ],
    ideas: ['Poetry can be a call to action.', 'Form should serve the message, not the other way round.'],
    snippets: []
  },
  {
    id: 'maro-prasthanam', title: 'Maro Prasthanam', native: 'మరో ప్రస్థానం', author: 'Sri Sri', nativeAuthor: 'శ్రీశ్రీ',
    status: 'finished', fav: true, lang: 'te', color: '#7a2f5a',
    tags: ['Telugu', 'Poetry'],
    summary: [
      'A later collection that picks up where Mahaprasthanam left off. The same revolutionary voice, older and still restless.'
    ],
    ideas: ['The second journey is often harder than the first.'],
    snippets: []
  },
  {
    id: 'siprali', title: 'Siprali', native: 'సిప్రాలి', author: 'Sri Sri', nativeAuthor: 'శ్రీశ్రీ',
    status: 'finished', fav: true, lang: 'te', color: '#c47a1e',
    tags: ['Telugu', 'Poetry', 'Wit'],
    summary: [
      'Sri Sri at play. The title packs three kinds of verse into one word: Sirisiri Muvvalu, Prasnalu (questions) and Limericks. Short, witty and often quietly savage.'
    ],
    ideas: ['Humour is a sharp tool for saying serious things.'],
    snippets: []
  },
  {
    id: 'antarmukham', title: 'Antarmukham', native: 'అంతర్ముఖం', author: 'Yandamoori Veerendranath', nativeAuthor: 'యండమూరి వీరేంద్రనాథ్',
    status: 'finished', fav: false, lang: 'te', color: '#4b3a7a',
    tags: ['Telugu', 'Novel'],
    summary: [
      'The title means looking inward, and the novel does exactly that. Yandamoori follows a man taking stock of his life, his relationships and the choices that shaped him.'
    ],
    ideas: ['Looking back honestly is the first step to moving forward.'],
    snippets: []
  }
];

const STATUS = { reading: 'Reading now', finished: 'Finished', next: 'Up next' };
const FILTERS = { all: () => true, reading: b => b.status === 'reading', fav: b => b.fav, te: b => b.lang === 'te' };
const view = document.getElementById('view');
let filter = 'all';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function cover(b){ return `<div class="cover" style="background:${esc(b.color)}">${b.fav ? '<span class="fav" aria-label="Favourite">Favourite</span>' : ''}<span class="ct">${b.native ? `<span class="te">${esc(b.native)}</span>` : ''}${esc(b.title)}</span><span class="ca">${b.nativeAuthor ? `<span class="te-a">${esc(b.nativeAuthor)}</span> · ` : ''}${esc(b.author)}</span></div>`; }

function shelf(){
  const list = BOOKS.filter(FILTERS[filter] || FILTERS.all);
  const reading = BOOKS.filter(b => b.status === 'reading').length;
  document.getElementById('count').textContent = `${reading} on the go · ${BOOKS.length} on the shelf`;
  const btn = (k, label) => `<button type="button" data-f="${k}" aria-pressed="${filter === k}">${label}</button>`;
  view.innerHTML = `
    <div style="display:grid;gap:0">
      <div class="awning" aria-hidden="true"></div>
      <div class="sign"><small>Platform 1 · bookstall</small><h1>What I am reading</h1>
      <p>Every journey needs something to read on the train. Favourites, Telugu classics and what is on the go right now. Tap a book for a short summary, its key ideas, and the code snippets it sparked.</p></div>
    </div>
    <div class="filters" role="group" aria-label="Filter books">${btn('all','All')}${btn('reading','Reading now')}${btn('fav','Favourites')}${btn('te','Telugu')}</div>
    ${list.length ? `<div class="shelf">${list.map(b => `
      <a class="book" href="#${esc(b.id)}" aria-label="${esc(b.title)} by ${esc(b.author)}">
        ${cover(b)}
        <span class="meta"><b>${esc(b.title)}</b><span class="pill s-${esc(b.status)}">${STATUS[b.status] || ''}</span></span>
      </a>`).join('')}</div>` : `<div class="empty">Nothing on this shelf yet.</div>`}`;
  view.querySelectorAll('[data-f]').forEach(el => el.addEventListener('click', () => { filter = el.dataset.f; shelf(); }));
  document.title = 'Platform Bookstall';
}

function detail(b){
  const snips = b.snippets && b.snippets.length
    ? b.snippets.map((s, i) => `<div class="snip"><div class="sh"><span>${esc(s.title)} · ${esc(s.lang)}</span><button type="button" data-copy="${i}">Copy</button></div><pre><code>${esc(s.code)}</code></pre></div>`).join('')
    : `<div class="soon">Code snippets for this one are coming soon.</div>`;
  view.innerHTML = `
    <div class="detail">
      ${cover(b)}
      <article class="ticket">
        <div class="tk"><span>${STATUS[b.status] || ''}</span><a href="#" style="color:#fff">All books</a></div>
        <div class="bd">
          <h2>${esc(b.title)}</h2>${b.native ? `<div class="native">${esc(b.native)}</div>` : ''}
          <div class="by">${esc(b.author)}${b.nativeAuthor ? ' · ' + esc(b.nativeAuthor) : ''}</div>
          <div class="tags">${(b.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
          <h3>In short</h3>
          ${(b.summary || []).map(p => `<p>${esc(p)}</p>`).join('')}
          <h3>Key ideas</h3>
          <ul>${(b.ideas || []).map(t => `<li>${esc(t)}</li>`).join('')}</ul>
          <h3>Code snippets</h3>
          ${snips}
        </div>
      </article>
    </div>`;
  view.querySelectorAll('[data-copy]').forEach(el => el.addEventListener('click', () => {
    const code = b.snippets[+el.dataset.copy].code;
    try { navigator.clipboard.writeText(code).then(() => { el.textContent = 'Copied'; setTimeout(() => el.textContent = 'Copy', 1500); }, () => {}); } catch (e) {}
  }));
  document.title = b.title + ' · Platform Bookstall';
  scrollTo(0, 0);
}

function route(){
  const id = location.hash.slice(1);
  const b = BOOKS.find(x => x.id === id);
  b ? detail(b) : shelf();
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
